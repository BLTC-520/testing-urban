[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgjb"
version = "1.0.0"
description = "Singapore / Johor Bahru 15-Minute City Explorer — reproducible network accessibility and scenario pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SG/JB 15-Minute City Explorer contributors" }]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=16",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.4",
  "h3>=4.1",
  "numba>=0.60",
  "osmium>=4.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# pmtiles and mapbox-vector-tile are here rather than only in [landmarks] so
# that CI actually runs the footprint tests: they are a couple of megabytes,
# where bpy is a couple of hundred, and without them six tests silently skip.
dev = ["pytest>=8", "matplotlib>=3.8", "networkx>=3.2", "pmtiles>=3.4", "mapbox-vector-tile>=2.1"]
# The 3D landmarks in the dashboard map (see scripts/landmarks/). Separate from
# the pipeline because bpy is Blender — a few hundred megabytes — and nothing in
# the analysis needs it. `pip install bpy` only resolves on the exact CPython
# version a given Blender release embeds; 5.2 is built for 3.13.
landmarks = [
  "bpy>=5.2,<6",
  "pillow>=11",
  "pmtiles>=3.4",
  "mapbox-vector-tile>=2.1",
]

[project.scripts]
sgjb = "sgjb.pipeline:main"
sgjb-fetch = "sgjb.acquire:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["data: tests that need the full pipeline outputs in data/ (skipped when absent)"]
