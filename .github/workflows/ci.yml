name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build:site
      - run: npm run check:site

  # The command centre: API + dashboard. Node 24 matches the Docker image,
  # which runs the server's TypeScript directly with Node's type stripping.
  command-centre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            dashboard/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix server run ingest
      - run: npm --prefix server run verify
      - run: npm --prefix server run typecheck
      - run: npm --prefix server test
      - run: npm --prefix dashboard ci
      - run: npm --prefix dashboard test
      # vue-tsc -b + vite build; no token here, so the 3D buildings switch is left out.
      - run: npm --prefix dashboard run build
      - run: docker build -t sgjb-command-centre .
