name: Deploy site

# Builds the static site from the committed analysis artifacts (web/public/data, web/public/tiles)
# and publishes it with GitHub Pages. Enable Pages → "GitHub Actions" in the repository settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:site
        env:
          # Where the header's Command Centre link points. Unset = no link on the live site.
          # Settings → Secrets and variables → Actions → Variables → DASHBOARD_URL
          VITE_DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      - run: npm run check:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
